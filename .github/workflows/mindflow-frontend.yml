# MindFlow Flutter client CI (Architecture.md §13.2).
#
# Same principle as the backend pipeline: every gate blocks. `flutter analyze`
# runs with --fatal-infos because the alternative — a warning list nobody reads —
# is how lint configuration quietly stops meaning anything.

name: mindflow-frontend

on:
  push:
    branches: [main]
    paths: ["mindflow/frontend/**", ".github/workflows/mindflow-frontend.yml"]
  pull_request:
    paths: ["mindflow/frontend/**", ".github/workflows/mindflow-frontend.yml"]

concurrency:
  group: mindflow-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mindflow/frontend

env:
  FLUTTER_VERSION: "3.27.1"

jobs:
  static:
    name: Format, analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos

  tests:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test suite
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: mindflow/frontend/coverage/lcov.info

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The platform folders are generated rather than committed: they are
      # tool output, and a stale ios/ or android/ directory is a class of merge
      # conflict nobody should have to resolve by hand.
      - name: Generate platform projects
        run: flutter create --platforms=android,ios --project-name mindflow .
      - name: Build
        run: |
          flutter build apk --debug \
            --dart-define=MINDFLOW_API_BASE_URL=https://api.example.invalid \
            --dart-define=MINDFLOW_LOCAL_AUTH=true
