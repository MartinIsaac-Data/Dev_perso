# MindFlow Flutter client CI (Architecture.md §13.2).
#
# Same principle as the backend pipeline: every gate blocks. `flutter analyze`
# runs with --fatal-infos because the alternative — a warning list nobody reads —
# is how lint configuration quietly stops meaning anything.

name: mindflow-frontend

on:
  push:
    branches: [main]
    paths: ["mindflow/frontend/**", ".github/workflows/mindflow-frontend.yml"]
  pull_request:
    paths: ["mindflow/frontend/**", ".github/workflows/mindflow-frontend.yml"]

concurrency:
  group: mindflow-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mindflow/frontend

env:
  FLUTTER_VERSION: "3.27.1"

jobs:
  static:
    name: Format, analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos

  tests:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test suite
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: mindflow/frontend/coverage/lcov.info

  mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # `android/` and `ios/` are still generated rather than committed: nothing
      # in this project customises them, so they remain tool output. The desktop
      # and web folders are committed (ADR-060) because they are not.
      - name: Generate mobile platform projects
        run: flutter create --platforms=android,ios --project-name mindflow .
      - name: Build
        run: |
          flutter build apk --debug \
            --dart-define=MINDFLOW_API_BASE_URL=https://api.example.invalid \
            --dart-define=MINDFLOW_LOCAL_AUTH=true

  # One matrix entry per host, because there is no cross-compilation: a Windows
  # binary needs a Windows runner and a macOS bundle needs a macOS one. Web and
  # Linux share ubuntu, and Linux needs GTK development headers that the image
  # does not carry by default — the failure without them is a pkg-config error
  # that reads like a Flutter bug.
  desktop:
    name: Build ${{ matrix.target }}
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-latest
          - target: linux
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest
          - target: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: GTK development libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build
      - run: flutter pub get
      - name: Build
        shell: bash
        env:
          MINDFLOW_API_BASE_URL: https://api.example.invalid
        run: ./tool/build.sh ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: mindflow-${{ matrix.target }}
          path: |
            mindflow/frontend/build/web
            mindflow/frontend/build/linux/x64/release/bundle
            mindflow/frontend/build/windows/x64/runner/Release
            mindflow/frontend/build/macos/Build/Products/Release
          if-no-files-found: ignore
