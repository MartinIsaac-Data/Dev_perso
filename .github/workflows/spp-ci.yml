# CI de sports-prediction-platform.
#
# Le workflow vit à la racine du dépôt (GitHub n'inspecte que .github/ à la
# racine) mais tout s'exécute dans le sous-dossier du projet.
name: spp-ci

on:
  push:
    paths: ["sports-prediction-platform/**", ".github/workflows/spp-ci.yml"]
  pull_request:
    paths: ["sports-prediction-platform/**", ".github/workflows/spp-ci.yml"]

defaults:
  run:
    working-directory: sports-prediction-platform

jobs:
  quality:
    name: Lint, types et frontières de modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check spp tests
      - name: ruff (format)
        run: ruff format --check spp tests
      - name: mypy
        run: mypy spp
      - name: frontières de modules
        # Contrat central : les modèles ne lisent pas le marché directement.
        run: lint-imports

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: suite complète
        run: pytest --cov=spp --cov-report=term-missing
      - name: tests anti-fuite (exécutés seuls, pour être lisibles)
        run: pytest -m leakage tests/leakage

  schema:
    name: Schéma SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spp
          POSTGRES_PASSWORD: spp
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U spp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: client postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: appliquer le schéma sur une base jetable
        env:
          PGPASSWORD: spp
          SPP_TEST_DATABASE_URL: postgresql://spp:spp@localhost:5433/postgres
        run: ./scripts/check_schema.sh

  docker:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -f docker/Dockerfile -t spp:ci .
