# The skill taxonomy: nodes and edges of the directed acyclic graph.
#
# An edge `from -> to` means: `from` must be held at `required_level` before
# `to` can be meaningfully learned. Edges are claims about learning order, not
# about topic similarity — `dax` depends on `dimensional_modelling` because
# writing DAX against a badly modelled dataset teaches you the wrong lessons,
# not because the two are related subjects.
#
# `decay_months` is per skill because decay rates genuinely differ. Hands-on
# syntax rots in under a year; conceptual and social skills barely rot at all.
# A taxonomy with one global decay constant flags the wrong things.

