# Demonstration dataset. Entirely fictional.
#
# It exists so the application can be shown to somebody without exposing a
# single real figure, and so the graph, the quota alerts and the market gap
# have something to say on a fresh install. It is deliberately *not* a
# flattering dataset: there is a quarter with nothing published, several
# skills past their decay window, and a business case that scored 6.28.
# A demo where everything is green demonstrates nothing.
#
# Demo "today" is around July 2026.

