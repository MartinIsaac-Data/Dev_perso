<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Capture vocale, structuration automatique et recherche dans vos propres notes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MindFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#5B5BD6">
  <title>MindFlow AI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Shown until the Dart entrypoint takes over, then removed by the engine.
       Not decoration: a Flutter web bundle takes seconds to boot on a cold
       cache, and a blank white page for three seconds is indistinguishable from
       a broken deployment. -->
  <div id="boot">
    <div id="boot-mark"></div>
    <p>MindFlow</p>
  </div>
  <style>
    body { margin: 0; background: #FCFCFD; }
    @media (prefers-color-scheme: dark) { body { background: #111113; } }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #60646C;
    }
    #boot-mark {
      width: 28px; height: 28px; border-radius: 8px; background: #5B5BD6;
      animation: boot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.92); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    /* The engine removes #boot once the first frame is painted; this only
       matters if that never happens, in which case the message stays and the
       user is not staring at nothing. */
  </style>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
